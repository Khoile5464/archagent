[project]
name = "archagent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["archagent_config"]

[tool.setuptools.packages.find]
include = [
    "knowledge_base*",
    "multimodal_reviewer*",
    "reasoning_engine*",
    "safety_wrapper*",
    "security*",
]
